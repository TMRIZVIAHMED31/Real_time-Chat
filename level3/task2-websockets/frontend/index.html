<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codveda | Real-Time Chat (Socket.io)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="auth-screen" class="screen">
    <h1>Real-Time Chat</h1>
    <p>Level 3 Task 2 — Socket.io over a JWT-authenticated connection</p>

    <div class="tabs">
      <button id="tab-login" class="tab active">Login</button>
      <button id="tab-signup" class="tab">Sign Up</button>
    </div>

    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <form id="signup-form" class="hidden">
      <input type="text" id="signup-name" placeholder="Full name" required />
      <input
        type="email"
        id="signup-email"
        placeholder="Email (must end with @gmail.com)"
        pattern="[^\s@]+@gmail\.com"
        title="Use a valid @gmail.com address"
        required
      />
      <input type="password" id="signup-password" placeholder="Password (min 6 chars)" minlength="6" required />
      <button type="submit">Create Account</button>
    </form>

    <p id="auth-error" class="error"></p>
  </div>

  <div id="chat-screen" class="screen hidden">
    <header>
      <h2>#<span id="room-name">general</span></h2>
      <div>
        <span id="me-label"></span>
        <button id="logout-btn">Logout</button>
      </div>
    </header>

    <div id="online-users"></div>
    <div id="messages"></div>
    <p id="typing-indicator"></p>

    <form id="message-form">
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
